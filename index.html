<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Professional Calculator</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="space-scene" aria-hidden="true">
    <div class="nebula nebula--one"></div>
    <div class="nebula nebula--two"></div>
    <div class="earth"></div>
  </div>

  <main class="calculator" aria-label="Calculator">
    <header class="calculator__header">
      <h1>AstraCalc</h1>
      <p>Premium Calculator</p>
    </header>

    <section class="display" aria-live="polite">
      <div class="display__expression" id="expression">&nbsp;</div>
      <div class="display__value" id="display">0</div>
    </section>

    <section class="buttons">
      <button class="btn btn--subtle" data-action="clear-all">AC</button>
      <button class="btn btn--subtle" data-action="clear-entry">CE</button>
      <button class="btn btn--subtle" data-action="delete">⌫</button>
      <button class="btn btn--operator" data-action="/">÷</button>

      <button class="btn" data-number="7">7</button>
      <button class="btn" data-number="8">8</button>
      <button class="btn" data-number="9">9</button>
      <button class="btn btn--operator" data-action="*">×</button>

      <button class="btn" data-number="4">4</button>
      <button class="btn" data-number="5">5</button>
      <button class="btn" data-number="6">6</button>
      <button class="btn btn--operator" data-action="-">−</button>

      <button class="btn" data-number="1">1</button>
      <button class="btn" data-number="2">2</button>
      <button class="btn" data-number="3">3</button>
      <button class="btn btn--operator" data-action="+">+</button>

      <button class="btn btn--subtle" data-action="toggle-sign">±</button>
      <button class="btn" data-number="0">0</button>
      <button class="btn btn--subtle" data-action="percent">%</button>
      <button class="btn btn--equal" data-action="=">=</button>

      <button class="btn btn--wide" data-number=".">.</button>
    </section>

    <footer class="calculator__hint">Keyboard: 0-9, +, -, *, /, Enter, Backspace, Esc</footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
